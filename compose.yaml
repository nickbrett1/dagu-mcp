services:
  dagu-mcp:
    build: .
    image: dagu-mcp:latest
    container_name: dagu-mcp
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "127.0.0.1:3007:3007"
    environment:
      - TZ=US/Eastern
      - DAGU_MCP_PORT=3007
      - DAGU_DAGS_DIR=/dags
      - DAGU_LOGS_DIR=/logs
      - DAGU_CONTAINER=dagu
    volumes:
      # dagu data (edit surface + logs)
      - /volume1/docker/dagu/data/dags:/dags:rw
      - /volume1/docker/dagu/data/logs:/logs:ro
      # docker socket + host docker CLI so we can `docker exec dagu dagu ...`
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/local/bin/docker:/usr/local/bin/docker:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
