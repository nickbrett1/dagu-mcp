name: docker-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/nickbrett1/dagu-mcp:latest
      - name: Set GHCR package visibility (public)
        run: |
          IMAGE="ghcr.io/nickbrett1/dagu-mcp"
          PKG_NAME="$(basename "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "Setting GHCR package '$PKG_NAME' visibility to 'public'..."
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/$PKG_NAME/visibility" \
            -d '{"visibility":"public"}' || \
          curl -fsS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/nickbrett1/packages/container/$PKG_NAME/visibility" \
            -d '{"visibility":"public"}'
