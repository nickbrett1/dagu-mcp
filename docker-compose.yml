# Docker Compose for dagu-mcp (NAS deployment)
#
# Runs the published GHCR image (ghcr.io/nickbrett1/dagu-mcp). Auto-updated by
# Watchtower on each new GHCR publish (this repo is tracked by the main
# unscoped watchtower instance).
#
# Deploy: import docker-compose.yml as a Container Manager "Project" (NAS).

services:
  dagu-mcp:
    image: ghcr.io/nickbrett1/dagu-mcp:latest
    container_name: dagu-mcp
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    ports:
      - "127.0.0.1:3007:3007"
    environment:
      - TZ=US/Eastern
      - DAGU_MCP_PORT=3007
      - DAGU_DAGS_DIR=/dags
      - DAGU_LOGS_DIR=/logs
      - DAGU_CONTAINER=dagu
    volumes:
      # dagu data (edit surface + logs)
      - /volumeUSB1/usbshare/docker/dagu/data/dags:/dags:rw
      - /volumeUSB1/usbshare/docker/dagu/data/logs:/logs:ro
      # docker socket + host docker CLI so we can `docker exec dagu dagu ...`
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /usr/local/bin/docker:/usr/local/bin/docker:ro
    networks:
      - default
      - ai_proxy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "homepage.group=Services"
      - "homepage.name=dagu-mcp"
      - "homepage.href=http://nas.local:3007/"

networks:
  ai_proxy:
    external: true
